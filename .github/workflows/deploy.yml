name: Deploy Sphinx Documentation

on:
  push:
    branches:
      - main # O la rama principal de tu repositorio

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme  # O pip install -r docs/requirements.txt

      - name: Build Documentation
        run: |
          make html  # Usar el Makefile es la forma estándar de trabajar con Sphinx

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build # ¡La carpeta de construcción correcta!